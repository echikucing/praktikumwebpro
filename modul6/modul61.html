<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validasi Form onblur</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Form Pendaftaran</h2>
    <form id="myForm" onsubmit="return validasiSemua();">
      <!-- Input Nama -->
      <div class="form-group">
        <label for="nama">Nama:</label>
        <input
          type="text"
          id="nama"
          onblur="cekNama()"
          placeholder="Masukkan nama lengkap"
        />
        <span id="errNama" class="error-msg"></span>
      </div>

      <!-- Input Email -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          type="text"
          id="email"
          onblur="cekEmail()"
          placeholder="contoh@domain.com"
        />
        <span id="errEmail" class="error-msg"></span>
      </div>

      <!-- Input Umur -->
      <div class="form-group">
        <label for="umur">Umur:</label>
        <input
          type="number"
          id="umur"
          onblur="cekUmur()"
          placeholder="1 - 100"
        />
        <span id="errUmur" class="error-msg"></span>
      </div>

      <button type="submit">Kirim Data</button>
    </form>

    <script src="script.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Percobaan Internal CSS</title>

  <!-- Internal CSS -->
  <style>
    /* Mengatur background halaman menjadi biru muda */
    body {
      background-color: #E0F7FA;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    /* Mengatur judul utama h1 */
    h1 {
      color: #006064;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>Modul 2: Percobaan Internal CSS</h1>
  <p>Halaman ini menggunakan <strong>Internal CSS</strong> untuk mengatur tampilannya.</p>
  <p>Dan menggunakan background biru muda.</p>

</body>
</html>
